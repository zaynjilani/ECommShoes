<section class="products-header">
  <div class="container">
    <p class="eyebrow">Shop</p>
    <h1>All Products</h1>
    <p class="products-header__desc">Browse our full collection, curated for modern everyday wear.</p>

    <div class="search-inline">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="search"
        placeholder="Search products, categories, descriptions..."
        [(ngModel)]="filters.q"
        (keyup.enter)="runSearch()"
      />
      <button type="button" class="btn btn-primary btn-sm" (click)="runSearch()">Search</button>
    </div>
  </div>
</section>

<section class="container products-layout">
  <!-- Filters sidebar (desktop) -->
  <aside class="filters-panel" [class.is-open]="isFilterPanelOpen">
    <div class="filters-panel__head">
      <h3>Filters</h3>
      <button type="button" class="btn-ghost-link" (click)="clearFilters()" *ngIf="activeFilterCount">Clear all</button>
      <button type="button" class="filters-panel__close" (click)="toggleFilterPanel()" aria-label="Close filters">×</button>
    </div>

    <div class="filter-group">
      <h4>Category</h4>
      <ul class="filter-list">
        <li *ngFor="let c of categories">
          <button
            type="button"
            [class.is-active]="filters.category === c"
            (click)="selectCategory(c)"
          >{{ c }}</button>
        </li>
      </ul>
    </div>

    <div class="filter-group">
      <h4>Size</h4>
      <div class="size-chip-grid">
        <button
          type="button"
          class="size-chip"
          *ngFor="let s of availableSizes"
          [class.is-active]="filters.sizes.includes(s)"
          (click)="toggleSize(s)"
        >{{ s }}</button>
      </div>
    </div>

    <div class="filter-group">
      <h4>Price Range</h4>
      <div class="price-inputs">
        <input
          type="number"
          class="input"
          placeholder="Min"
          [(ngModel)]="filters.minPrice"
          (change)="applyPriceRange()"
        />
        <span>—</span>
        <input
          type="number"
          class="input"
          placeholder="Max"
          [(ngModel)]="filters.maxPrice"
          (change)="applyPriceRange()"
        />
      </div>
    </div>
  </aside>

  <div class="filters-overlay" *ngIf="isFilterPanelOpen" (click)="toggleFilterPanel()"></div>

  <!-- Results -->
  <div class="products-results">
    <div class="results-toolbar">
      <button type="button" class="btn btn-outline btn-sm filter-toggle-btn" (click)="toggleFilterPanel()">
        Filters <span class="count-pill" *ngIf="activeFilterCount">{{ activeFilterCount }}</span>
      </button>

      <span class="results-count" *ngIf="!loading">{{ (filteredProducts$ | async)?.length ?? 0 }} products</span>

      <select class="select sort-select" [ngModel]="filters.sort" (ngModelChange)="changeSort($event)">
        <option value="default">Sort: Default</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="name-asc">Name: A-Z</option>
        <option value="newest">Newest</option>
      </select>
    </div>

    <app-loading *ngIf="loading"></app-loading>

    <ng-container *ngIf="!loading">
      <div class="product-grid" *ngIf="(filteredProducts$ | async)?.length; else noResults">
        <app-product-card
          *ngFor="let product of (filteredProducts$ | async)"
          [product]="product"
        ></app-product-card>
      </div>

      <ng-template #noResults>
        <app-empty-state
          icon="search"
          title="No products found"
          message="Try adjusting your search or filters to find what you're looking for."
          actionLabel="Clear filters"
        >
          <button type="button" class="btn btn-primary" (click)="clearFilters()">Clear filters</button>
        </app-empty-state>
      </ng-template>
    </ng-container>
  </div>
</section>
