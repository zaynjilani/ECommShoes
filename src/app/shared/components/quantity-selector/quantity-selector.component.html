<div class="qty-selector" [class.qty-selector--sm]="size === 'sm'">
  <button type="button" (click)="decrease()" [disabled]="quantity <= min" aria-label="Decrease quantity">−</button>
  <span class="qty-value">{{ quantity }}</span>
  <button type="button" (click)="increase()" [disabled]="quantity >= max" aria-label="Increase quantity">+</button>
</div>
