<header class="site-header" [class.is-scrolled]="isScrolled">
  <div class="announce-bar">
    <p>Free delivery on orders over Rs. 10,000 · Order easily via WhatsApp</p>
  </div>

  <div class="container header-row">
    <a routerLink="/" class="brand" (click)="closeMobileMenu()">
      <span class="brand-mark">{{ config.logoText.charAt(0) }}</span>
      <span class="brand-name">{{ config.logoText }}</span>
    </a>

    <nav class="main-nav" aria-label="Primary">
      <a
        *ngFor="let link of config.navLinks"
        [routerLink]="link.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: link.path === '/' }"
      >{{ link.label }}</a>
    </nav>

    <div class="header-actions">
      <button
        type="button"
        class="icon-btn"
        (click)="toggleSearch()"
        [attr.aria-expanded]="isSearchOpen"
        aria-label="Search products"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      <a routerLink="/cart" class="icon-btn cart-btn" aria-label="View cart">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-count" *ngIf="(itemCount$ | async) as count">{{ count > 0 ? count : '' }}</span>
      </a>

      <button
        type="button"
        class="icon-btn hamburger"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="isMobileMenuOpen"
        aria-label="Toggle menu"
      >
        <svg *ngIf="!isMobileMenuOpen" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
        <svg *ngIf="isMobileMenuOpen" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="search-bar" *ngIf="isSearchOpen">
    <div class="container search-bar__inner">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="search"
        placeholder="Search for products, categories..."
        [(ngModel)]="searchTerm"
        (keyup.enter)="submitSearch()"
        autofocus
      />
      <button type="button" class="btn btn-primary btn-sm" (click)="submitSearch()">Search</button>
    </div>
  </div>

  <div class="mobile-menu" *ngIf="isMobileMenuOpen">
    <nav class="container">
      <a
        *ngFor="let link of config.navLinks"
        [routerLink]="link.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: link.path === '/' }"
        (click)="closeMobileMenu()"
      >{{ link.label }}</a>
      <a routerLink="/cart" (click)="closeMobileMenu()">Cart</a>
    </nav>
  </div>
</header>
